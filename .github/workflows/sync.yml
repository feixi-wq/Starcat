name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *' # 每天自动同步一次
  workflow_dispatch:      # 支持手动一键触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync upstream main branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 添加上游仓库源
          git remote add upstream https://github.com/starcat-app/Starcat.git
          git fetch upstream main
          
          # 合并上游 main 分支并推送到你自己的仓库
          git merge upstream/main --ff-only || git merge upstream/main -m "chore: sync with upstream"
          git push origin main
